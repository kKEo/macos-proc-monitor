name: Release

# Two ways to release:
#   • Actions › Release › Run workflow, with a version such as 0.2.0: bumps PmonVersion on master,
#     commits, tags v0.2.0, then builds, tests, signs, notarises and publishes the release.
#   • Push a tag such as v0.2.0 yourself: the same build and publish. The binaries take their version
#     from the tag; when PmonVersion in the code differs, the run warns and the code is left as it is.
#
# Signing and notarisation are optional and switch on when these repository secrets exist:
#   MACOS_CERTIFICATE           base64 of a Developer ID Application certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD  the .p12 password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   an app-specific password, for notarisation
# Without them the binaries are ad-hoc signed, as before.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0, or 0.2.0-rc.1 for a pre-release)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version such as 0.2.0 or 0.2.0-rc.1"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - name: Bump PmonVersion, commit and tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          file=Sources/PmonCore/Config/Config.swift
          sed -i -E "s/(public static let string = )\"[^\"]*\"/\1\"$VERSION\"/" "$file"
          grep -q "public static let string = \"$VERSION\"" "$file" || { echo "::error::could not set the version in $file"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
          fi
          git tag -a "v$VERSION" -m "pmon $VERSION"
          git push origin HEAD:master "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign and publish
    needs: prepare
    # Runs after `prepare` for a manual release, and on its own for a pushed tag.
    if: always() && (needs.prepare.result == 'success' || (github.event_name == 'push' && needs.prepare.result == 'skipped'))
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Take the version from a pushed tag
        if: github.event_name == 'push'
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not a version such as v0.2.0 or v0.2.0-rc.1"; exit 1
          fi
          file=Sources/PmonCore/Config/Config.swift
          code="$(sed -nE 's/.*public static let string = "([^"]*)".*/\1/p' "$file")"
          if [ "$code" != "$version" ]; then
            sed -i '' -E "s/(public static let string = )\"[^\"]*\"/\1\"$version\"/" "$file"
            echo "::warning::PmonVersion in the code is $code; building $version from the tag. Run the Release workflow instead of pushing tags to keep the code in step."
          fi

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as $identity"

      - name: Build, test, sign and package
        run: |
          # Notarisation needs every Apple secret; without them release.sh skips it.
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ] || [ -z "${SIGN_IDENTITY:-}" ]; then
            unset APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD
            echo "NOTARISED=0" >> "$GITHUB_ENV"
          else
            echo "NOTARISED=1" >> "$GITHUB_ENV"
          fi
          Support/release.sh

      - name: Check that the tag matches the built version
        run: |
          version="$(.build/release/pmon --version)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the version in the code ($version); update PmonVersion in Sources/PmonCore/Config/Config.swift"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write the release notes
        run: |
          if [ "$NOTARISED" = 1 ]; then
            trust="The binaries are signed with a Developer ID and notarised by Apple."
          elif [ -n "${SIGN_IDENTITY:-}" ]; then
            trust="The binaries are signed with a Developer ID but not notarised: after downloading, clear the quarantine flag with \`xattr -dr com.apple.quarantine pmon-$VERSION\`."
          else
            trust="The binaries are ad-hoc signed and not notarised: after downloading, clear the quarantine flag with \`xattr -dr com.apple.quarantine pmon-$VERSION\`, or build from source."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          \`\`\`
          tar -xzf pmon-$VERSION.tar.gz
          cd pmon-$VERSION && ./install.sh
          \`\`\`

          $trust Check the download with \`shasum -a 256 -c pmon-$VERSION.tar.gz.sha256\`.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 "pmon-$VERSION.tar.gz" > "pmon-$VERSION.tar.gz.sha256"
          assets=("pmon-$VERSION.tar.gz" "pmon-$VERSION.tar.gz.sha256")
          # A release made by hand for this tag (e.g. on the GitHub page) keeps its title and notes;
          # only the files are added, replacing any of the same name.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists; uploading the files to it"
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag --title "pmon $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${flags[@]}"

      - name: Remove the signing keychain
        if: always() && env.MACOS_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  homebrew:
    name: Homebrew formula and bottle
    needs: [prepare, release]
    # After every successful release; skipped (with a notice) for pre-releases or without HOMEBREW_TAP_TOKEN,
    # a token that can push to kKEo/homebrew-tap (fine-grained, that repository only, Contents: read and write).
    if: always() && needs.release.result == 'success'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Decide whether to publish
        id: check
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew formula is not updated"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *-* ]]; then
            echo "::notice::$TAG is a pre-release; the Homebrew formula stays on the latest release"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.skip != '1'
        with:
          ref: ${{ env.TAG }}

      - name: Tap kKEo/homebrew-tap
        if: steps.check.outputs.skip != '1'
        run: git clone "https://x-access-token:${TAP_TOKEN}@github.com/kKEo/homebrew-tap.git" "$(brew --repository)/Library/Taps/kkeo/homebrew-tap"

      - name: Write the formula and build the bottle
        if: steps.check.outputs.skip != '1'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "pmon-$VERSION.tar.gz.sha256" --dir "$RUNNER_TEMP"
          sha="$(cut -d' ' -f1 "$RUNNER_TEMP/pmon-$VERSION.tar.gz.sha256")"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # One bottle labelled for the oldest supported macOS serves that version and every newer one.
          BOTTLE_TAG=arm64_sonoma Support/homebrew.sh "$VERSION" "$sha" kkeo/tap "$base" "$RUNNER_TEMP/bottles" "$base/pmon-$VERSION.tar.gz"

      # The bottle goes up before the formula that points at it.
      - name: Attach the bottle to the release
        if: steps.check.outputs.skip != '1'
        run: gh release upload "$TAG" "$RUNNER_TEMP"/bottles/*.bottle.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Push the formula
        if: steps.check.outputs.skip != '1'
        run: |
          cd "$(brew --repository kkeo/tap)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pmon.rb
          if git diff --cached --quiet; then echo "the formula is unchanged"; exit 0; fi
          git commit -m "pmon $VERSION"
          # The clone is on the tap's default branch, which is the one Homebrew reads.
          git push origin HEAD
