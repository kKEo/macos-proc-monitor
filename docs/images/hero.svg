    <text x="40" y="222" font-size="13" fill="#94a3b8">Sample</text>
    <text x="130" y="222" font-size="13" fill="#94a3b8">→  Store  →  Detect  →  Blame  →  Explain</text>
    <text x="860" y="222" font-size="13" text-anchor="end" fill="#7dd3fc">100 % local · no root · no network</text>
