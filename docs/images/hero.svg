  <rect x="470" y="40" width="190" height="150" rx="6" fill="#fb7185" opacity=".10"/>
  <path d="M40 160 L110 156 L170 162 L230 150 L290 158 L350 148 L410 155 L460 150 L490 90 L520 52 L555 48 L590 60 L630 120 L660 150 L720 156 L790 152 L860 158 L860 190 L40 190Z" fill="url(#spike)"/>
  <path d="M40 160 L110 156 L170 162 L230 150 L290 158 L350 148 L410 155 L460 150 L490 90 L520 52 L555 48 L590 60 L630 120 L660 150 L720 156 L790 152 L860 158" fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="555" cy="48" r="6" fill="#fb7185" filter="url(#glow)"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#e2e8f0">
    <text x="40" y="34" font-size="26" font-weight="700">pmon</text>
    <text x="110" y="34" font-size="14" fill="#94a3b8">which app made my Mac sluggish, when, and why?</text>
