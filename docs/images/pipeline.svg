<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-label="How pmon works: sample, store, detect, blame, explain">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1l8 4-8 4z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .b{fill:#0f172a;stroke:url(#g);stroke-width:2}
    .h{font:700 16px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#f1f5f9;text-anchor:middle}
    .s{font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
    .n{font:700 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#7dd3fc;text-anchor:middle}
    .a{stroke:#a78bfa;stroke-width:2;fill:none;marker-end:url(#ar)}
  </style>
  <rect width="900" height="170" rx="16" fill="#111827"/>
  <g transform="translate(20 40)">
    <rect class="b" width="148" height="90" rx="12"/><text class="n" x="74" y="24">1</text>
    <text class="h" x="74" y="48">Sample</text><text class="s" x="74" y="68">CPU, memory, I/O</text>
  </g>
  <g transform="translate(200 40)">
    <rect class="b" width="148" height="90" rx="12"/><text class="n" x="74" y="24">2</text>
    <text class="h" x="74" y="48">Store</text><text class="s" x="74" y="68">local SQLite</text>
  </g>
  <g transform="translate(380 40)">
    <rect class="b" width="148" height="90" rx="12"/><text class="n" x="74" y="24">3</text>
    <text class="h" x="74" y="48">Detect</text><text class="s" x="74" y="68">slowdown episodes</text>
  </g>
  <g transform="translate(560 40)">
    <rect class="b" width="148" height="90" rx="12"/><text class="n" x="74" y="24">4</text>
    <text class="h" x="74" y="48">Blame</text><text class="s" x="74" y="68">rank apps + confidence</text>
  </g>
  <g transform="translate(740 40)">
    <rect class="b" width="140" height="90" rx="12"/><text class="n" x="70" y="24">5</text>
    <text class="h" x="70" y="48">Explain</text><text class="s" x="70" y="68">pmon why</text>
  </g>
  <path class="a" d="M170 85H196"/><path class="a" d="M350 85H376"/><path class="a" d="M530 85H556"/><path class="a" d="M710 85H736"/>
</svg>
